<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium Tic‑Tac‑Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="title">Tic‑Tac‑Toe</div>
      <div class="subtitle">Premium glass UI • Play vs Player or CPU</div>
      <div class="controls">
        <label class="toggle">
          <input id="modeToggle" type="checkbox">
          <span>Play vs CPU</span>
        </label>
        <select id="difficulty" class="select" title="CPU difficulty">
          <option value="easy">Easy</option>
          <option value="hard">Hard (Minimax)</option>
        </select>
        <button id="undoBtn" class="btn outline" title="Undo last move">↶ Undo</button>
        <button id="redoBtn" class="btn outline" title="Redo move">↷ Redo</button>
        <select id="themeSelect" class="select" title="Theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="mint">Mint</option>
        </select>
        <button id="resetBtn" class="btn">Restart Round</button>
        <button id="newBtn" class="btn outline">New Match</button>
        <button id="muteBtn" class="btn outline" aria-pressed="false" title="Mute/unmute">🔊</button>
      </div>
    </header>

    <section class="board-wrap">
      <div class="scoreboard">
        <div class="player">
          <div class="mark x">X</div>
          <div>Score: <span id="scoreX">0</span></div>
        </div>
        <div class="status" id="status">X's turn</div>
        <div class="player">
          <div class="mark o">O</div>
          <div>Score: <span id="scoreO">0</span></div>
        </div>
      </div>

      <div class="board" id="board">
        <!-- 9 cells -->
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <div class="extras">
        <div class="history">
          <h4>Move History</h4>
          <ol id="moveList" class="move-list" aria-live="polite"></ol>
        </div>
        <svg id="winSvg" class="win-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </section>

    <div class="overlay hidden" id="overlay">
      <div class="message" id="message">
        <p id="messageText">X wins!</p>
        <button id="continueBtn" class="btn">Continue</button>
      </div>
    </div>

    <footer class="footer">Designed with care • Responsive • Animated</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
